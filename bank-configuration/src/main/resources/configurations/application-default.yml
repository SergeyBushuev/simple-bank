host: 127.0.0.1
base-url: http://${host}

services:
  bank-front:
    host: ${host}
    port: 8079
    url: ${base-url}:${services.bank-front.port}
  gateway-server:
    host: ${host}
    port: 8080
    name: gateway-server
    url: ${base-url}:${services.gateway-server.port}
  bank-exchange:
    host: ${host}
    port: 8081
    url: ${base-url}:${services.bank-exchange.port}
  bank-transfer:
    host: ${host}
    port: 8082
    url: ${base-url}:${services.bank-transfer.port}
  bank-blocker:
    host: ${host}
    port: 8083
    url: ${base-url}:${services.bank-blocker.port}
  bank-accounts:
    host: ${host}
    port: 8084
    url: ${base-url}:${services.bank-accounts.port}
  bank-exchange-generator:
    host: ${host}
    port: 8085
    url: ${base-url}:${services.bank-exchange-generator.port}
  bank-cash:
    host: ${host}
    port: 8086
    url: ${base-url}:${services.bank-cash.port}
  bank-notifications:
    host: ${host}
    port: 8087
    url: ${base-url}:${services.bank-notifications.port}
  bank-configuration:
    host: ${host}
    port: 8888
    url: ${base-url}:${services.bank-configuration.port}

headers:
  user-header: X-User-Login

management:
  endpoints:
    web:
      exposure:
        include: '*'
  endpoint:
    health:
      show-details: always

logging:
  level:
    web: info
    org.springframework.security: info