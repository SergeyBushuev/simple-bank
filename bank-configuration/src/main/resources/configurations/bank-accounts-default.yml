server:
  port: ${services.bank-accounts.port}

spring:

  cloud:
    zookeeper:
      discovery:
        enabled: true
      connect-string: localhost:2181

    gateway:
      server:
        webflux:
          routes:
            - id: bank-front-route
              uri: lb://gateway-server
              predicates:
                - Path=/
              filters:
                - TokenRelay=simple-bank-client

  security:
    oauth2:
      client:
        provider:
          keycloak:
            token-uri: http://localhost:8180/realms/simple-bank/protocol/openid-connect/token
            authorization-uri: http://localhost:8180/realms/simple-bank/protocol/openid-connect/auth
            jwk-set-uri: http://localhost:8180/realms/simple-bank/protocol/openid-connect/certs
        registration:
          simple-bank-client:
            client-id: simple-bank-client
            client-secret: VmGXQDXNGOZzJH5Mx7Fi4OyHtnb3IH8A
            authorization-grant-type: client_credentials
            scope: openid
            provider: keycloak

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    enabled: true
    drop-first: true

  r2dbc:
    url: r2dbc:postgresql://localhost:5432/accounts-db
    username: postgres
    password: postgres