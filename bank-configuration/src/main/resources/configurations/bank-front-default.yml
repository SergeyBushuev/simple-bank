server:
  port: ${services.bank-front.port}

spring:
  main:
    allow-bean-definition-overriding: true
  cloud:
    zookeeper:
      discovery:
        enabled: true
      connect-string: localhost:2181

  security:
    oauth2:
      client:
        provider:
          keycloak:
            token-uri: http://localhost:8180/realms/simple-bank/protocol/openid-connect/token
            authorization-uri: http://localhost:8180/realms/simple-bank/protocol/openid-connect/auth
            jwk-set-uri: http://localhost:8180/realms/simple-bank/protocol/openid-connect/certs
        registration:
          simple-bank-client:
            client-id: simple-bank-client
            client-secret: VmGXQDXNGOZzJH5Mx7Fi4OyHtnb3IH8A
            authorization-grant-type: client_credentials
            scope: openid
            provider: keycloak

  thymeleaf:
    encoding: UTF-8
    mode: HTML

resilience4j:
  retry:
    instances:
      gateway-service:
        max-attempts: 3
        wait-duration: 1s
  circuitbreaker:
    instances:
      gateway-service:
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s