version: '3'
services:

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - app_network

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "9092:9092"
    networks:
      - app_network

  keycloak:
    image: quay.io/keycloak/keycloak:26.1.3
    environment:
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: 8080
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8180:8080"
    volumes:
      - ./realm-export.json:/opt/keycloak/data/import/realm-export.json
    command: start-dev --import-realm
    networks:
      - bank_network

  accounts-postgres:
    image: postgres:16.1-alpine
    environment:
      POSTGRES_DB: accounts-db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./bank-accounts/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - bank_network

  notifications-postgres:
    image: postgres:16.1-alpine
    environment:
      POSTGRES_DB: notifications-db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./bank-notifications/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5434:5432"
    networks:
      - bank_network

  bank-front-app:
    image: bank-front-app:latest
    build:
      context: .
      dockerfile: bank-front/Dockerfile
    environment:
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/simple-bank/protocol/openid-connect/certs
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_KEYCLOAK_AUTHORIZATION_URI: http://keycloak:8080/realms/simple-bank/protocol/openid-connect/auth
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_KEYCLOAK_TOKEN_URI: http://keycloak:8080/realms/simple-bank/protocol/openid-connect/token
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/simple-bank/protocol/openid-connect/certs
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_simple-bank_CLIENT_CLIENT_ID: simple-bank-client
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_simple-bank_CLIENT_CLIENT_SECRET: VmGXQDXNGOZzJH5Mx7Fi4OyHtnb3IH8A
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_simple-bank_CLIENT_PROVIDER: keycloak
    ports:
      - "8079:8079"
    restart: on-failure
    networks:
      - bank_network

  bank-exchange-app:
    image: bank-exchange-app:latest
    build:
      context: .
      dockerfile: bank-exchange/Dockerfile
    environment:
      KAFKA_BROKERS: kafka:29092
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/simple-bank/protocol/openid-connect/certs
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_KEYCLOAK_AUTHORIZATION_URI: http://keycloak:8080/realms/simple-bank/protocol/openid-connect/auth
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_KEYCLOAK_TOKEN_URI: http://keycloak:8080/realms/simple-bank/protocol/openid-connect/token
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/simple-bank/protocol/openid-connect/certs
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_simple-bank_CLIENT_CLIENT_ID: simple-bank-client
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_simple-bank_CLIENT_CLIENT_SECRET: VmGXQDXNGOZzJH5Mx7Fi4OyHtnb3IH8A
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_simple-bank_CLIENT_PROVIDER: keycloak
    ports:
      - "8081:8081"
    restart: on-failure
    networks:
      - bank_network

  bank-transfer-app:
    image: bank-transfer-app:latest
    build:
      context: .
      dockerfile: bank-transfer/Dockerfile
    environment:
      KAFKA_BROKERS: kafka:29092
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/simple-bank/protocol/openid-connect/certs
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_KEYCLOAK_AUTHORIZATION_URI: http://keycloak:8080/realms/simple-bank/protocol/openid-connect/auth
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_KEYCLOAK_TOKEN_URI: http://keycloak:8080/realms/simple-bank/protocol/openid-connect/token
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/simple-bank/protocol/openid-connect/certs
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_simple-bank_CLIENT_CLIENT_ID: simple-bank-client
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_simple-bank_CLIENT_CLIENT_SECRET: VmGXQDXNGOZzJH5Mx7Fi4OyHtnb3IH8A
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_simple-bank_CLIENT_PROVIDER: keycloak
    ports:
      - "8082:8082"
    restart: on-failure
    networks:
      - bank_network

  bank-blocker-app:
    image: bank-blocker-app:latest
    build:
      context: .
      dockerfile: bank-blocker/Dockerfile
    environment:
      KAFKA_BROKERS: kafka:29092
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/simple-bank/protocol/openid-connect/certs
    ports:
      - "8083:8083"
    restart: on-failure
    networks:
      - bank_network

  bank-accounts-app:
    image: bank-accounts-app:latest
    build:
      context: .
      dockerfile: bank-accounts/Dockerfile
    environment:
      KAFKA_BROKERS: kafka:29092
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/simple-bank/protocol/openid-connect/certs
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_KEYCLOAK_AUTHORIZATION_URI: http://keycloak:8080/realms/simple-bank/protocol/openid-connect/auth
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_KEYCLOAK_TOKEN_URI: http://keycloak:8080/realms/simple-bank/protocol/openid-connect/token
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/simple-bank/protocol/openid-connect/certs
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_simple-bank_CLIENT_CLIENT_ID: simple-bank-client
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_simple-bank_CLIENT_CLIENT_SECRET: VmGXQDXNGOZzJH5Mx7Fi4OyHtnb3IH8A
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_simple-bank_CLIENT_PROVIDER: keycloak
      SPRING_R2DBC_URL: r2dbc:postgresql://accounts-postgres:5432/accounts-db
      SPRING_R2DBC_USERNAME: postgres
      SPRING_R2DBC_PASSWORD: postgres
    ports:
      - "8084:8084"
    restart: on-failure
    networks:
      - bank_network

  bank-exchange-generator-app:
    image: bank-exchange-generator-app:latest
    build:
      context: .
      dockerfile: bank-exchange-generator/Dockerfile
    environment:
      KAFKA_BROKERS: kafka:29092
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/simple-bank/protocol/openid-connect/certs
      SPRING_R2DBC_URL: r2dbc:postgresql://exchange-postgres:5432/exchange-db
      SPRING_R2DBC_USERNAME: postgres
      SPRING_R2DBC_PASSWORD: postgres
    ports:
