server:
  port: 8080

spring:
  application:
    name: service-gateway

  main:
    allow-bean-definition-overriding: true
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: front-route
              uri: http://simple-bank-service-front:8079
              predicates:
                - Path=/
              filters:
                - TokenRelay=simple-bank-client
                - UserHeader

            - id: front-main-route
              uri: http://simple-bank-service-front:8079
              predicates:
                - Path=/main
              filters:
                - TokenRelay=simple-bank-client
                - UserHeader

            - id: accounts-post-signup-route
              uri: http://simple-bank-service-accounts:8084
              predicates:
                - Path=/api/signup
                - Method=POST
              filters:
                - TokenRelay=simple-bank-client

            - id: edit-password-route
              uri: http://simple-bank-service-accounts:8084
              predicates:
                - Path=/user/{login}/editPassword
              filters:
                - TokenRelay=simple-bank-client

            - id: exchange-route
              uri: http://simple-bank-service-exchange:8085
              predicates:
                - Path=/api/rates
              filters:
                - TokenRelay=simple-bank-client

            - id: edit-accounts-route
              uri: http://simple-bank-service-accounts:8084
              predicates:
                - Path=/user/{login}/editUserAccounts
              filters:
                - TokenRelay=simple-bank-client

            - id: cash-route
              uri: http://simple-bank-service-cash:8086
              predicates:
                - Path=/user/{login}/cash
              filters:
                - TokenRelay=simple-bank-client

            - id: notifications-route
              uri: http://simple-bank-service-notifications:8087
              predicates:
                - Path=/api/{login}/notifications
              filters:
                - TokenRelay=simple-bank-client

            - id: transfer-route
              uri: http://simple-bank-service-transfer:8082
              predicates:
                - Path=/user/{login}/transfer
              filters:
                - TokenRelay=simple-bank-client

            - id: blocker-route
              uri: http://simple-bank-service-blocker:8083
              predicates:
                - Path=/api/{time}/block
              filters:
                - TokenRelay=simple-bank-client

            - id: cash-balance-route
              uri: http://simple-bank-service-accounts:8084
              predicates:
                - Path=/api/{login}/cash
              filters:
                - TokenRelay=simple-bank-client

            - id: get-account-route
              uri: http://simple-bank-service-accounts:8084
              predicates:
                - Path=/api/{login}/account/{currency}
              filters:
                - TokenRelay=simple-bank-client

            - id: convert-route
              uri: http://simple-bank-service-convert:8081
              predicates:
                - Path=/api/convert
              filters:
                - TokenRelay=simple-bank-client

            - id: accounts-user-route
              uri: http://simple-bank-service-accounts:8084
              predicates:
                - Path=/api/{login}/user
              filters:
                - TokenRelay=simple-bank-client

            - id: accounts-user-accounts-route
              uri: http://simple-bank-service-accounts:8084
              predicates:
                - Path=/api/{login}/accounts
              filters:
                - TokenRelay=simple-bank-client

            - id: accounts-users-route
              uri: http://simple-bank-service-accounts:8084
              predicates:
                - Path=/api/users
              filters:
                - TokenRelay=simple-bank-client

            - id: accounts-currencies-route
              uri: http://simple-bank-service-accounts:8084
              predicates:
                - Path=/api/currencies
              filters:
                - TokenRelay=simple-bank-client
  security:
    oauth2:
      client:
        provider:
          keycloak:
            token-uri: http://localhost:8180/realms/simple-bank/protocol/openid-connect/token
            authorization-uri: http://localhost:8180/realms/simple-bank/protocol/openid-connect/auth
            jwk-set-uri: http://localhost:8180/realms/simple-bank/protocol/openid-connect/certs
        registration:
          simple-bank-client:
            client-id: simple-bank-client
            client-secret: VmGXQDXNGOZzJH5Mx7Fi4OyHtnb3IH8A
            authorization-grant-type: client_credentials
            scope: openid
            provider: keycloak
  thymeleaf:
    encoding: UTF-8
    mode: HTML
resilience4j:
  retry:
    instances:
      gateway-service:
        max-attempts: 3
        wait-duration: 1s
  circuitbreaker:
    instances:
      gateway-service:
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s

headers:
  user-header: X-User-Login

management:
  endpoints:
    web:
      exposure:
        include: '*'
  endpoint:
    health:
      show-details: always

logging:
  level:
    web: info
    org.springframework.security: info

services:
  service-gateway:
    name: "simple-bank-service-gateway:8080"