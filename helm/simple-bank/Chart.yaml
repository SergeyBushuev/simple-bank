apiVersion: v2
name: simple-bank
description: Simbple bank umbrella chart

# A chart can be either an 'application' or a 'library' chart.
#
# Application charts are a collection of templates that can be packaged into versioned archives
# to be deployed.
#
# Library charts provide useful utilities or functions for the chart developer. They're included as
# a dependency of application charts to inject those utilities and functions into the rendering
# pipeline. Library charts do not define any templates and therefore cannot be deployed.
type: application

# This is the chart version. This version number should be incremented each time you make changes
# to the chart and its templates, including the app version.
# Versions are expected to follow Semantic Versioning (https://semver.org/)
version: 0.1.0
appVersion: "1.0.0"

dependencies:
  # Infrastructure Dependencies
  - name: keycloak
    version: "0.1.0"
    repository: "file://../charts/keycloak"
    condition: keycloak.enabled
  
  - name: postgresql-accounts
    version: "0.1.0"
    repository: "file://../charts/postgresql-accounts"
    condition: postgresql-accounts.enabled
  
  - name: postgresql-exchange
    version: "0.1.0"
    repository: "file://../charts/postgresql-exchange"
    condition: postgresql-exchange.enabled
  
  - name: postgresql-notifications
    version: "0.1.0"
    repository: "file://../charts/postgresql-notifications"
    condition: postgresql-notifications.enabled

  # Service Dependencies
  - name: service-gateway
    version: "0.1.0"
    repository: "file://../charts/service-gateway"
    condition: service-gateway.enabled
  
  - name: bank-front
    version: "0.1.0"
    repository: "file://../charts/bank-front"
    condition: bank-front.enabled
  
  - name: bank-accounts
    version: "0.1.0"
    repository: "file://../charts/bank-accounts"
    condition: bank-accounts.enabled
  
  - name: bank-cash
    version: "0.1.0"
    repository: "file://../charts/bank-cash"
    condition: bank-cash.enabled
  
  - name: bank-exchange
    version: "0.1.0"
    repository: "file://../charts/bank-exchange"
    condition: bank-exchange.enabled
  
  - name: bank-exchange-generator
    version: "0.1.0"
    repository: "file://../charts/bank-exchange-generator"
    condition: bank-exchange-generator.enabled
  
  - name: bank-transfer
    version: "0.1.0"
    repository: "file://../charts/bank-transfer"
    condition: bank-transfer.enabled
  
  - name: bank-blocker
    version: "0.1.0"
    repository: "file://../charts/bank-blocker"
    condition: bank-blocker.enabled
  
  - name: bank-notifications
    version: "0.1.0"
    repository: "file://../charts/bank-notifications"
    condition: bank-notifications.enabled